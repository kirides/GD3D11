name: 'Package artifacts'

outputs:
  artifact-id-release:
    description: "ID of the release-zip artifact that was uploaded"
    value: ${{ steps.artifact-upload-release.outputs.artifact-id }}
  artifact-id-debug:
    description: "ID of the debug-zip artifact that was uploaded"
    value: ${{ steps.artifact-upload-debug.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - name: Calculate artifact paths
      id: calc-path
      shell: pwsh
      run: |
        if ($env:GITHUB_REF_TYPE -eq "tag") {
          $tagOrGitShortHash = $env:GITHUB_REF_NAME
        } else {
          $shortHash = $env:GITHUB_SHA.Substring(0, 9)
          $tagOrGitShortHash = "git-$shortHash"
        }
        $dirName = "GD3D11-$tagOrGitShortHash"

        "release-dir=$dirName" >> $env:GITHUB_OUTPUT
        "download-dir=downloaded-artifacts" >> $env:GITHUB_OUTPUT

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        path: ${{ steps.calc-path.outputs.download-dir }}
        merge-multiple: true

    - name: Prepare Release Structure
      shell: pwsh
      run: |
        $relDir = "${{ steps.calc-path.outputs.release-dir }}"
        $artifactDir = "${{ steps.calc-path.outputs.download-dir }}"
        $binDir = "$relDir/GD3D11/Bin"

        New-Item -Path $binDir -ItemType Directory -Force
        
        Copy-Item -Path "D3D11Engine/Shaders" -Destination "$relDir/GD3D11/shaders/" -Recurse -Force
        Copy-Item -Path "blobs/Fonts" -Destination "$relDir/GD3D11/Fonts/" -Recurse -Force
        Copy-Item -Path "blobs/Meshes" -Destination "$relDir/GD3D11/Meshes/" -Recurse -Force
        Copy-Item -Path "blobs/Textures" -Destination "$relDir/GD3D11/Textures/" -Recurse -Force
        Copy-Item -Path "blobs/libs/*" -Destination "$relDir/" -Recurse -Force

        Copy-Item -Path "$artifactDir/*" -Destination $binDir -Force
        Move-Item -Path "$binDir/ddraw.dll" -Destination "$relDir/" -Force
        Move-Item -Path "$binDir/ddraw.pdb" -Destination "$relDir/" -Force

    - name: Fetch D3D12 Agility SDK
      shell: pwsh
      env:
        AGILITY_SDK_VERSION: '1.619.5'
      run: |
        $ErrorActionPreference = "Stop"

        $version = $env:AGILITY_SDK_VERSION
        $relDir = "${{ steps.calc-path.outputs.release-dir }}"
        $targetDir = "$relDir/GD3D11/D3D12"
        $nupkg = Join-Path ([System.IO.Path]::GetTempPath()) "microsoft.direct3d.d3d12.$version.nupkg"

        Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/$version" -OutFile $nupkg

        New-Item -Path $targetDir -ItemType Directory -Force | Out-Null

        # The .nupkg is a plain zip; pull only the Win32 runtime DLLs out of it.
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $nupkg))
        try {
          foreach ($name in @("D3D12Core.dll", "d3d12SDKLayers.dll", "D3D12StateObjectCompiler.dll")) {
            $entryPath = "build/native/bin/win32/$name"
            $entry = $zip.Entries | Where-Object { $_.FullName -ieq $entryPath }
            if (-not $entry) { throw "Entry '$entryPath' not found in $nupkg" }
            $dest = Join-Path $targetDir $name
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
            Write-Host "Extracted $($entry.FullName) -> $dest"
          }
        } finally {
          $zip.Dispose()
        }

    - name: Create final Zip
      shell: pwsh
      run: |
        $relDir = "${{ steps.calc-path.outputs.release-dir }}"
        7z a -tzip -mx=7 -mmt=on "-xr!*.pdb" "$relDir.zip" "./$relDir/*"

    - name: Create final Zip (debug)
      shell: pwsh
      run: |
        $relDir = "${{ steps.calc-path.outputs.release-dir }}"
        7z a -tzip -mx=7 -mmt=on "$relDir-debug.zip" "./$relDir/*"        

    - name: Upload release Zip artifact
      id: artifact-upload-release
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.calc-path.outputs.release-dir }}
        path: "${{ steps.calc-path.outputs.release-dir }}.zip"
        if-no-files-found: error
        compression-level: 0

    - name: Upload debug Zip artifact
      id: artifact-upload-debug
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.calc-path.outputs.release-dir }}-debug
        path: "${{ steps.calc-path.outputs.release-dir }}-debug.zip"
        if-no-files-found: error
        compression-level: 0
