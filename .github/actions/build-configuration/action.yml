name: 'Build configuration'

inputs:
  configuration:
    description: "MSBuild configuration to build (e.g. Release, Release_AVX, Spacer_NET)"
    required: true
  project:
    description: "Path to the vcxproj file that should be built"
    required: true
  output-file:
    description: "Name of the build artifact"
    required: true

runs:
  using: composite
  steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 39344dff01c5a5a0134caf2624cdd492f05d30ea
        # Only clone/bootstrap vcpkg and export VCPKG_ROOT here; the actual manifest
        # install (with the x86-windows-static-md triplet) happens automatically
        # during MSBuild via vcpkg's own MSBuild integration (vcpkg.props/targets),
        # same as local builds.
        runVcpkgInstall: false

    # run-vcpkg exports the removed 'x-gha' backend; override it with a file cache.
    - name: Use file-based vcpkg binary cache
      shell: pwsh
      run: |
        "VCPKG_BINARY_SOURCES=clear;files,$env:GITHUB_WORKSPACE\vcpkg_binary_cache,readwrite" >> $env:GITHUB_ENV

    # Cached downloads also keep the MSYS2 tarballs, so a miss doesn't hit mirror.msys2.org.
    - name: Restore vcpkg binaries and downloads
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_binary_cache
          ${{ github.workspace }}/vcpkg/downloads
        key: vcpkg-x86-windows-static-md-39344dff-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-x86-windows-static-md-39344dff-

    # MSBuild's vcpkg <Exec> fails on any "error :" line, even recovered mirror fallbacks;
    # installing here judges by exit code only and leaves MSBuild's install a no-op.
    - name: Install vcpkg dependencies
      shell: pwsh
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install --x-wait-for-lock --triplet x86-windows-static-md `
          --vcpkg-root "$env:VCPKG_ROOT" `
          "--x-manifest-root=$env:GITHUB_WORKSPACE" `
          "--x-install-root=$env:GITHUB_WORKSPACE\vcpkg_installed"

    - name: Save vcpkg binaries and downloads
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_binary_cache
          ${{ github.workspace }}/vcpkg/downloads
        key: vcpkg-x86-windows-static-md-39344dff-${{ hashFiles('vcpkg.json') }}

    - name: Run MSBuild
      id: build
      shell: pwsh
      run: |
        $shortHash = $env:GITHUB_SHA.Substring(0, 9)
        if ($env:GITHUB_REF_TYPE -eq "tag") {
          $tagOrGit = $env:GITHUB_REF_NAME
        } else {
          $tagOrGit = "git"
        }
        $isoDate = Get-Date -Format "yyyy-MM-dd"
        $versionString = "$tagOrGit-$shortHash"
        $outputName = [System.IO.Path]::GetFileNameWithoutExtension("${{ inputs.output-file }}")
        $outputDir = "$env:GITHUB_WORKSPACE\outputs\"
        $Env:CL = (-join("/DVERSION_NUMBER#",'\"',$versionString,'\"', " /DBUILD_DATE#",'\"',$isoDate,'\"'))
        echo "CL=$Env:CL" >> $Env:GITHUB_ENV

        $msbuildArgs = @(
          "${{ inputs.project }}",
          "/p:Configuration=${{ inputs.configuration }}",
          "/p:Platform=Win32",
          "/p:TargetName=$outputName",
          "/p:OutDir=$outputDir",
          "/p:GD3D11_DISABLE_ANALYZE=true"
        )

        msbuild @msbuildArgs

        "artifact-base-path=$outputDir$outputName" >> $env:GITHUB_OUTPUT

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.configuration }}
        path: |
          ${{ steps.build.outputs.artifact-base-path }}.dll
          ${{ steps.build.outputs.artifact-base-path }}.pdb
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
